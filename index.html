<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Killer Sudoku — sudoku.com Clone</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <nav class="nav">
    <a class="active" href="#">Killer</a><a href="#">Sudoku</a>
  </nav>
  <div class="header-timer">
    <span class="header-timer-label">TIME</span>
    <span class="timer" id="timer">00:00</span>
    <span class="pill" id="difficultyPill">Expert</span>
  </div>
</header>

<div class="wrap">
  <aside class="left-stack">
    <div class="card">
      <div style="font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px">⚙ Difficulty</div>
      <div class="difficulty">
        <button class="diff-btn" data-diff="easy">Easy</button>
        <button class="diff-btn" data-diff="medium">Medium</button>
        <button class="diff-btn" data-diff="hard">Hard</button>
        <button class="diff-btn active" data-diff="expert">Expert</button>
      </div>
      <div class="stats" style="margin-top:12px">
        <span>Mistakes <b id="mistakes">0/3</b></span><span id="progress">0% filled</span>
      </div>
      <button class="sums-btn" id="sumsBtn" title="Look up cage sum combinations">∑ Sum combos</button>
    </div>
  </aside>

  <main class="card board-card">
    <div class="board-wrap" id="boardWrap">
      <div class="grid" id="grid"></div>
      <div class="pause-overlay" id="pauseOverlay" style="display:none"><div style="text-align:center"><h3>⏸ Paused</h3><p style="color:var(--muted);margin-top:6px">Press Resume to continue</p><button class="btn btn-primary" style="margin-top:14px" onclick="togglePause()">Resume</button></div></div>
      <div class="pause-overlay" id="gameOverOverlay" style="display:none"><div style="text-align:center"><h3 style="color:var(--danger)">Game Over</h3><p style="color:var(--muted);margin-top:6px">You made 3 mistakes</p><div style="display:flex;gap:10px;justify-content:center;margin-top:14px"><button class="btn btn-ghost" onclick="undo()" style="border:1px solid #e6eef8">↩ Undo</button><button class="btn btn-primary" onclick="newGame()">★ New Game</button></div></div></div>
    </div>
    <div class="controls-row">
      <button class="ctrl" id="undoBtn"><i>↩</i> Undo</button>
      <button class="ctrl active" id="notesBtn"><i>✎</i> Notes</button>
      <button class="ctrl" id="fillNotesBtn" title="Auto-fill candidates in all empty cells"><i>▦</i> Fill Notes</button>
      <button class="ctrl" id="hintBtn"><i>💡</i> Hint</button>
      <button class="ctrl active" id="lightningSwitch" title="Toggle Lightning"><i>⚡</i> Lightning</button>
      <button class="ctrl" id="newGameBtn" title="Start a new game"><i>★</i> New Game</button>
    </div>
  </main>

  <aside class="right-stack">
    <div class="card">
      <div class="numpad" id="numpad"></div>
    </div>
    <div class="card howto" id="cageInfo">
      <h4>Selected cage</h4>
      <p id="cageDetail">Select a cell to see cage sum and remaining.</p>
    </div>
  </aside>
</div>

<div class="sums-overlay" id="sumsOverlay" hidden>
  <div class="sums-modal" role="dialog" aria-modal="true" aria-labelledby="sumsTitle">
    <div class="sums-head">
      <h3 id="sumsTitle">Sum combinations</h3>
      <button class="sums-close" id="sumsClose" aria-label="Close">✕</button>
    </div>
    <div class="sums-filters">
      <label>Cage size
        <select id="sumsSize">
          <option value="2">2 cells</option>
          <option value="3">3 cells</option>
          <option value="4">4 cells</option>
          <option value="5">5 cells</option>
        </select>
      </label>
      <label>Sum
        <select id="sumsSum"></select>
      </label>
    </div>
    <p class="sums-count" id="sumsCount"></p>
    <div class="sums-digits" id="sumsDigits"></div>
    <div class="sums-list" id="sumsList"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
