<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Killer Sudoku — sudoku.com Clone</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar" style="justify-content:center">
  <nav class="nav">
    <a class="active" href="#">Killer</a><a href="#">Sudoku</a>
  </nav>
</header>

<div class="wrap">
  <aside class="left-stack">
    <div class="card timer-card">
      <div>
        <div style="font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.08em">TIME</div>
        <div class="timer" id="timer">00:00</div>
      </div>
      <span class="pill" id="difficultyPill">Medium</span>
    </div>
    <div class="card" style="padding:12px;display:flex;gap:8px">
      <button class="icon-btn" id="pauseBtn" title="Pause" style="flex:0 0 44px">⏸</button>
      <button class="btn btn-primary" id="newGameBtn" style="flex:1;justify-content:center">★ New Game</button>
    </div>

    <div class="card">
      <div style="font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px">⚙ Difficulty</div>
      <div class="difficulty">
        <button class="diff-btn" data-diff="easy">Easy</button>
        <button class="diff-btn active" data-diff="medium">Medium</button>
        <button class="diff-btn" data-diff="hard">Hard</button>
        <button class="diff-btn" data-diff="expert">Expert</button>
      </div>
      <div class="stats" style="margin-top:12px">
        <span>Mistakes <b id="mistakes">0/3</b></span><span id="progress">0% filled</span>
      </div>
      <div class="toggle" style="margin-top:10px">
        <span class="toggle-label"><span class="toggle-icon">✓</span> Auto-check</span><div class="switch on" id="autoCheckSwitch"></div>
      </div>
      <div class="toggle" style="margin-top:8px">
        <span class="toggle-label"><span class="toggle-icon">⚡</span> Lightning</span><div class="switch on" id="lightningSwitch"></div>
      </div>
    </div>
  </aside>

  <main class="card board-card">
    <div class="board-wrap" id="boardWrap">
      <div class="grid" id="grid"></div>
      <div class="pause-overlay" id="pauseOverlay" style="display:none"><div style="text-align:center"><h3>⏸ Paused</h3><p style="color:var(--muted);margin-top:6px">Press Resume to continue</p><button class="btn btn-primary" style="margin-top:14px" onclick="togglePause()">Resume</button></div></div>
    </div>
    <div class="controls-row">
      <button class="ctrl" id="undoBtn"><i>↩</i> Undo</button>
      <button class="ctrl" id="eraseBtn"><i>⌫</i> Erase</button>
      <button class="ctrl" id="notesBtn"><i>✎</i> Notes</button>
      <button class="ctrl" id="fillNotesBtn" title="Auto-fill candidates in all empty cells"><i>▦</i> Fill Notes</button>
      <button class="ctrl" id="hintBtn"><i>💡</i> Hint</button>
    </div>
  </main>

  <aside class="right-stack">
    <div class="card">
      <div class="numpad" id="numpad"></div>
    </div>
    <div class="card howto" id="cageInfo">
      <h4>Selected cage</h4>
      <p id="cageDetail">Select a cell to see cage sum and remaining.</p>
    </div>
  </aside>
</div>

<div class="footer">Clone of <b>sudoku.com/killer</b> — single-file HTML • cage sums • notes • keyboard • timer • no external deps</div>

<script src="app.js"></script>
</body>
</html>
